<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Тиын</title>
<meta name="description" content="Учёт расходов, баланса и долгов. Данные хранятся на устройстве.">
<meta name="theme-color" content="#EDF2F3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тиын">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  try {
    var t = localStorage.getItem('tiyn-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header class="top">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>Тиын</h1>
    <span class="top-date" id="top-date"></span>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Разделы"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<noscript><p style="padding:24px">Для работы приложения включи JavaScript в браузере.</p></noscript>
<script src="app.js"></script>
</body>
</html>
